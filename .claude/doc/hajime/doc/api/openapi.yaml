openapi: 3.0.3

info:
  title: Hajime – Judo Tournament Management API
  description: |
    REST API pro systém správy judo turnajů **Hajime**.

    ## Autentizace
    Každý request musí obsahovat platný API token buď jako HTTP hlavičku nebo query parametr.

    ```
    X-Api-Token: <token>
    ```
    nebo
    ```
    GET /api/rest/tournament/list?token=<token>
    ```

    Tokeny jsou konfigurovány v `config/local.neon` → `parameters.apiTokens`.

    ## Formát odpovědi
    Všechny odpovědi mají tvar:
    ```json
    {
      "app": {
        "datetime": "2026-05-31 12:00:00",
        "version": 1.0
      },
      "response": { ... }
    }
    ```

    ## Formáty dat
    - Datum: `d.m.Y` (např. `15.05.2026`)
    - Datum a čas: `d.m.Y H:i` (např. `15.05.2026 09:00`)

  version: "1.0"
  contact:
    name: Evosoft
    email: info@evosoft.cz

servers:
  - url: /api/rest
    description: REST API base path

security:
  - ApiTokenHeader: []
  - ApiTokenQuery: []

tags:
  - name: Tournaments
    description: Správa turnajů
  - name: Members
    description: Správa závodníků
  - name: Clubs
    description: Správa klubů
  - name: Admins
    description: Správa adminů
  - name: Category
    description: Hmotnostní kategorie
  - name: CategoryAge
    description: Věkové kategorie
  - name: SubCategory
    description: Párovací skupiny (pavouk)
  - name: MemberCategory
    description: Přihlášky závodníků do kategorií
  - name: Scale
    description: Váhy
  - name: Tatami
    description: Zápaziště
  - name: TatamiMatch
    description: Sloty zápasů na tatami
  - name: TournamentMatch
    description: Zápasy v turnajovém pavouku
  - name: TournamentMatchData
    description: Auditní log stavu zápasů
  - name: Table
    description: Tabulkové přehledy kategorií

paths:

  # ─── TOURNAMENT ────────────────────────────────────────────────────────────

  /tournament/list:
    get:
      tags: [Tournaments]
      summary: Výpis všech aktivních turnajů
      operationId: tournamentList
      responses:
        "200":
          description: Kolekce turnajů (klíč = uid)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseTournamentCollection"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }

  /tournament/{uid}:
    get:
      tags: [Tournaments]
      summary: Detail turnaje
      operationId: tournamentShow
      parameters:
        - $ref: "#/components/parameters/TournamentUidPath"
      responses:
        "200":
          description: Detail turnaje včetně závodníků, klubů, adminů, tatami a vah
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseTournamentDetail"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    put:
      tags: [Tournaments]
      summary: Aktualizace turnaje
      operationId: tournamentUpdate
      parameters:
        - $ref: "#/components/parameters/TournamentUidPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestTournament"
      responses:
        "200":
          description: Turnaj úspěšně aktualizován
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseSuccess"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "406": { $ref: "#/components/responses/NotAcceptable" }
        "500": { $ref: "#/components/responses/InternalError" }

  /tournament/:
    post:
      tags: [Tournaments]
      summary: Vytvoření nového turnaje
      operationId: tournamentCreate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestTournament"
      responses:
        "200":
          description: Turnaj úspěšně vytvořen
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseSuccess"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "406": { $ref: "#/components/responses/NotAcceptable" }
        "500": { $ref: "#/components/responses/InternalError" }

  /tournament/approve/{uid}/{approved}:
    put:
      tags: [Tournaments]
      summary: Schválení / zrušení schválení turnaje
      operationId: tournamentApprove
      parameters:
        - $ref: "#/components/parameters/TournamentUidPath"
        - name: approved
          in: path
          required: true
          schema:
            type: boolean
          description: "true = schválit, false = zrušit schválení"
      responses:
        "200":
          description: Stav schválení byl změněn
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseSuccess"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
