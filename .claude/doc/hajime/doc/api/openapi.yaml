                $ref: "#/components/schemas/ApiResponseTatamiMatchCollection"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }

  /tatami-match/{id}:
    get:
      tags: [TatamiMatch]
      summary: Detail slotu zápasu na tatami
      operationId: tatamiMatchShow
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Detail tatami-match slotu
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseTatamiMatchDetail"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  # ─── TOURNAMENT MATCH ──────────────────────────────────────────────────────

  /tournament-match/list:
    get:
      tags: [TournamentMatch]
      summary: Výpis všech zápasů v turnajovém pavouku
      operationId: tournamentMatchList
      responses:
        "200":
          description: Kolekce zápasů (klíč = id)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseTournamentMatchCollection"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }

  /tournament-match/{id}:
    get:
      tags: [TournamentMatch]
      summary: Detail zápasu v pavouku
      operationId: tournamentMatchShow
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Detail zápasu včetně závodníků a skóre
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseTournamentMatchDetail"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  # ─── TOURNAMENT MATCH DATA ─────────────────────────────────────────────────

  /tournament-match-data/list:
    get:
      tags: [TournamentMatchData]
      summary: Výpis auditního logu změn stavu zápasů
      operationId: tournamentMatchDataList
      responses:
        "200":
          description: Kolekce záznamů (klíč = id)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseTournamentMatchDataCollection"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }

  /tournament-match-data/{id}:
    get:
      tags: [TournamentMatchData]
      summary: Detail záznamu o změně stavu zápasu
      operationId: tournamentMatchDataShow
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: JSON snapshot stavu zápasu s časovým razítkem
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseTournamentMatchDataDetail"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }

  # ─── TABLE ─────────────────────────────────────────────────────────────────

  /table/list:
    get:
      tags: [Table]
      summary: Výpis všech tabulkových přehledů kategorií
      operationId: tableList
      responses:
        "200":
          description: Kolekce tabulek (klíč = id)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseTableCollection"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/InternalError" }

  /table/{id}:
    get:
      tags: [Table]
      summary: Detail tabulkového přehledu
      operationId: tableShow
      parameters:
        - $ref: "#/components/parameters/IdPath"
      responses:
        "200":
          description: Detail tabulky
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseTableDetail"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalError" }
    put:
      tags: [Table]
      summary: Aktualizace tabulky
      operationId: tableUpdate
      parameters:
        - $ref: "#/components/parameters/IdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestTable"
      responses:
        "200":
          description: Tabulka úspěšně aktualizována
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseSuccess"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "406": { $ref: "#/components/responses/NotAcceptable" }
        "500": { $ref: "#/components/responses/InternalError" }

  /table/:
    post:
      tags: [Table]
      summary: Vytvoření tabulky
      operationId: tableCreate
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestTable"
      responses:
        "200":
          description: Tabulka úspěšně vytvořena
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiResponseSuccess"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "406": { $ref: "#/components/responses/NotAcceptable" }
        "500": { $ref: "#/components/responses/InternalError" }

# ═══════════════════════════════════════════════════════════════════════════════
# COMPONENTS
# ═══════════════════════════════════════════════════════════════════════════════

components:

  securitySchemes:
    ApiTokenHeader:
      type: apiKey
      in: header
      name: X-Api-Token
      description: API token v HTTP hlavičce
    ApiTokenQuery:
      type: apiKey
      in: query
      name: token
      description: API token jako query parametr

  parameters:
    UidPath:
      name: uid
      in: path
      required: true
      schema:
        type: string
      description: Externě sdílený identifikátor entity (UID)

    TournamentUidPath:
      name: tournament_uid
      in: path
      required: true
      schema:
        type: string
      description: UID turnaje (z /tournament/list)

    IdPath:
      name: id
      in: path
      required: true
      schema:
        type: integer
      description: Interní databázové ID entity

  # ─── SHARED WRAPPER ────────────────────────────────────────────────────────

  schemas:

    ApiMeta:
      type: object
      description: Metadata odpovědi
      properties:
        datetime:
          type: string
          example: "2026-05-31 09:00:00"
        version:
          type: number
          example: 1.0

    ApiResponseSuccess:
      type: object
      properties:
        app:
          $ref: "#/components/schemas/ApiMeta"
        response:
          type: object
          properties:
            code:
              type: integer
              example: 200
            status:
              type: string
              example: success
            message:
              type: string
              example: "Entity ID: 42 with UID: abc123 was created."
            affectedEntity:
              type: integer
              nullable: true
              description: Interní ID ovlivněné entity (při POST/PUT)
              example: 42

    ApiResponseError:
      type: object
      properties:
        app:
          $ref: "#/components/schemas/ApiMeta"
        response:
          type: object
          properties:
            code:
              type: integer
            status:
              type: string
              example: error
            message:
              type: string
            requiredProperties:
              type: array
              items:
                type: string
              description: Seznam povinných polí (pouze při 400)
            invalidProperties:
              type: array
              items:
                type: string
              description: Seznam nevalidních polí (pouze při 400)

    # ─── ENTITY SCHEMAS ──────────────────────────────────────────────────────

    Tournament:
      type: object
      properties:
        uid:
          type: string
          description: Externě sdílený identifikátor
          example: "TRN-2026-001"
        tournament_csju_id:
          type: string
          description: ID v systému ČSJÚ
          example: "12345"
        name:
          type: string
          example: "Mistrovství ČR 2026"
        dt_tournament_start:
          type: string
          nullable: true
          description: "Formát: d.m.Y H:i"
          example: "15.05.2026 09:00"
        dt_tournament_end:
          type: string
          nullable: true
          description: "Formát: d.m.Y H:i"
          example: "15.05.2026 18:00"
        dt_term_for_registration:
          type: string
          nullable: true
          description: "Uzávěrka přihlášek. Formát: d.m.Y H:i"
          example: "01.05.2026 23:59"
        location:
          type: string
          example: "Sportovní hala Pardubice"
        tatami_count:
          type: integer
          example: 6
        scale_count:
          type: integer
          example: 3
        tournament_starting_fee:
          type: integer
          nullable: true
          description: Startovní poplatek v Kč
          example: 500
        web_link_for_registration:
          type: string
          nullable: true
          example: "https://judo.cz/registrace"
        street:
          type: string
          example: "Sukova"
        street_number:
          type: string
          nullable: true
          example: "1784"
        house_number:
          type: string
          nullable: true
          example: "2"
        city:
          type: string
          example: "Pardubice"
        postal_code:
          type: string
          example: "530 02"
        country:
          type: string
          example: "CZ"
        region:
          type: string
          example: "Pardubický kraj"
        type:
          type: string
          description: Typ turnaje (TournamentTypeEnum)
          example: "national"
        weight_required:
          type: boolean
          example: true

    TournamentDetail:
      allOf:
        - $ref: "#/components/schemas/Tournament"
        - type: object
          properties:
            members:
              type: array
              items:
                $ref: "#/components/schemas/Member"
            clubs:
              type: array
              items:
                $ref: "#/components/schemas/Club"
            admins:
              type: array
              items:
                $ref: "#/components/schemas/Admin"
            scales:
              type: array
              items:
                $ref: "#/components/schemas/Scale"
            tatami:
              type: array
              items:
                $ref: "#/components/schemas/Tatami"

    Member:
      type: object
      properties:
        uid:
          type: string
          example: "MBR-001"
        member_csju_id:
          type: string
          example: "CZ123456"
        firstname:
          type: string
          example: "Jan"
        lastname:
          type: string
          example: "Novák"
        gender:
          type: string
          enum: [MALE, FEMALE, BOTH]
          example: MALE
        dt_birth:
          type: string
          nullable: true
          description: "Formát: d.m.Y"
          example: "15.03.2005"
        dt_birthyear:
          type: integer
          example: 2005
        kyu:
          type: string
          nullable: true
          example: "1. kyu"
        dan:
          type: string
          nullable: true
          example: null
        dt_flexii_edit:
          type: string
          description: Datum poslední synchronizace z Flexii
          example: "01.01.2026 08:00"
        dt_match_end:
          type: string
          nullable: true
          example: null
        club:
          $ref: "#/components/schemas/Club"
        tournament:
          $ref: "#/components/schemas/Tournament"

    MemberDetail:
      allOf:
        - $ref: "#/components/schemas/Member"
        - type: object
          properties:
            memberCategory:
              type: array
              items:
                $ref: "#/components/schemas/MemberCategory"

    Club:
      type: object
      properties:
        uid:
          type: string
          example: "CLB-001"
        tournament:
          $ref: "#/components/schemas/Tournament"
        name:
          type: string
          example: "JK Pardubice"
        abbreviation:
          type: string
          example: "JKP"
        short_name:
          type: string
          example: "Pardubice"
        country:
          type: string
          example: "Česká republika"
        country_alpha2:
          type: string
          example: "CZ"
        country_alpha3:
          type: string
          example: "CZE"
        location:
          type: string
          example: "Pardubice"
        city:
          type: string
          example: "Pardubice"

    ClubDetail:
      allOf:
        - $ref: "#/components/schemas/Club"
        - type: object
          properties:
            members:
              type: array
              items:
                $ref: "#/components/schemas/Member"

    Admin:
      type: object
      properties:
        uid:
          type: string
          example: "ADM-001"
        full_name:
          type: string
          example: "Petr Rozhodčí"
        flexii_account:
          type: string
          nullable: true
          example: "petr.rozhodci@flexii.cz"

    Category:
      type: object
      properties:
        id:
          type: integer
          example: 1
        tournament:
          $ref: "#/components/schemas/Tournament"
        categoryAge:
          $ref: "#/components/schemas/CategoryAge"
        categoryPlus:
          nullable: true
          description: Kategorie, do které je tato sloučena
          allOf:
            - $ref: "#/components/schemas/Category"
        weight_name:
          type: string
          example: "-60 kg"
        weight_from:
          type: integer
          example: 0
        weight_to:
          type: integer
          example: 60
        priority:
          type: integer
          example: 1
        status:
          type: string
          nullable: true
          description: CategoryStatusEnum
          example: "weight_finished"
        merged_into:
          type: integer
          nullable: true
          example: null
        listed:
          type: boolean
          example: true

    CategoryAge:
      type: object
      properties:
        id:
          type: integer
          example: 1
        tournament:
          $ref: "#/components/schemas/Tournament"
        gender:
          type: string
          enum: [MALE, FEMALE, BOTH]
          example: MALE
        match_time:
          type: integer
          description: Délka zápasu v sekundách
          example: 240
        is_golden_score:
          type: boolean
          example: true
        golden_score_time:
          type: integer
          nullable: true
          description: Délka golden score v sekundách
          example: 300
        weight_tolerance:
          type: number
          format: float
          description: Povolená odchylka váhy v kg
          example: 0.5
        age_name:
          type: string
          example: "Kadeti muži"
        age_name_short:
          type: string
          example: "KM"
        age_from:
          type: integer
          example: 15
        age_to:
          type: integer
          example: 17
        listed:
          type: boolean
          example: true

    SubCategory:
      type: object
      properties:
        id:
          type: integer
          example: 1
        category:
          $ref: "#/components/schemas/Category"
        draw_system:
          type: string
          description: Typ turnajového pavouka (DrawSystemEnum)
          example: "Spider"
        draw_system_extra:
          type: string
          nullable: true
          example: null
        status:
          type: string
          description: SubCategoryStatusEnum
          example: "STATUS_SHUFFLED"
        is_repechage:
          type: boolean
          nullable: true
          example: true
        is_one_third_place:
          type: boolean
          nullable: true
          example: false
        priority:
          type: integer
          example: 1
        weight:
          type: number
          format: float
          nullable: true
          description: Výsledná váha skupiny (pro smíšené kategorie)
          example: null
        customName:
          type: string
          nullable: true
          example: null
        additional_weighting_enabled:
          type: boolean
          nullable: true
          example: false

    MemberCategory:
      type: object
      properties:
        id:
          type: integer
          example: 1
        is_approved:
          type: boolean
          description: Přihláška schválena po vážení
          example: true
        is_preregistered:
          type: boolean
          description: Předregistrace (bez váhy)
          example: false
        starting_number:
          type: integer
          nullable: true
          example: 42
        weight:
          type: number
          format: float
          nullable: true
          description: Naměřená váha v kg
          example: 59.8
        seeding:
          type: integer
          description: Nasazení v pavouku
          example: 1
        member:
          $ref: "#/components/schemas/Member"
        scale:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Scale"
        categoryAgePreregistered:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/CategoryAge"
        categoryAge:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/CategoryAge"
        categoryPreregistered:
          nullable: true
          allOf:
            - $ref: "#/components/schemas/Category"
        category:
          $ref: "#/components/schemas/Category"

    Scale:
      type: object
      properties:
        tournament:
          $ref: "#/components/schemas/Tournament"
        name:
          type: string
          example: "Váha 1"

    Tatami:
      type: object
      properties:
        tournament:
          $ref: "#/components/schemas/Tournament"
        name:
          type: string
          example: "Tatami A"

    TatamiMatch:
      type: object
      properties:
        tatami:
          $ref: "#/components/schemas/Tatami"
        tournament_match:
          $ref: "#/components/schemas/TournamentMatch"
        admin:
          $ref: "#/components/schemas/Admin"

    TournamentMatch:
      type: object
      properties:
        sub_category:
          $ref: "#/components/schemas/SubCategory"
        sub_category_match_number:
          type: integer
          description: Pořadové číslo zápasu v rámci párovací skupiny
          example: 1
        status:
          type: string
          description: MatchStatusEnum
          example: "finished"
        is_blue_winner:
          type: boolean
          description: "true = modrý závodník vyhrál, false = bílý"
          example: true
        match_data:
          type: object
          description: Skóre zápasu (ippon, wazari, shido, hansoku-make pro oba závodníky)
          properties:
            blue_ippon: { type: integer, example: 1 }
            blue_wazari: { type: integer, example: 0 }
            blue_shido: { type: integer, example: 0 }
            blue_hansoku_make: { type: boolean, example: false }
            white_ippon: { type: integer, example: 0 }
            white_wazari: { type: integer, example: 0 }
            white_shido: { type: integer, example: 2 }
            white_hansoku_make: { type: boolean, example: false }
            round: { type: integer, nullable: true, example: 4 }
            round_name: { type: string, nullable: true, example: "Final" }

    TournamentMatchData:
      type: object
      description: JSON snapshot stavu zápasu uložený při každé změně (auditní log)
      properties:
        timestamp:
          type: string
          example: "31.05.2026 10:45:30"
        match_data:
          type: object
          description: Libovolný JSON objekt zachycující stav zápasu v daném okamžiku

    Table:
      type: object
      properties:
        category:
          $ref: "#/components/schemas/Category"
        priority:
          type: integer
          example: 1
        number_of_members:
          type: integer
          example: 8

    # ─── REQUEST SCHEMAS ─────────────────────────────────────────────────────

    RequestTournament:
      type: object
      required:
        - uid
        - tournament_csju_id
        - name
        - location
        - street
        - city
        - postal_code
        - country
        - tatami_count
        - scale_count
        - type
      properties:
        uid:
          type: string
          example: "TRN-2026-001"
        tournament_csju_id:
          type: string
          example: "12345"
        name:
          type: string
          example: "Mistrovství ČR 2026"
        dt_tournament_start:
          type: string
          nullable: true
          description: "Formát: d.m.Y H:i"
          example: "15.05.2026 09:00"
        dt_tournament_end:
