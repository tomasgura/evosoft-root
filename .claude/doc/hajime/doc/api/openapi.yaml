  # ─── RESPONSES ─────────────────────────────────────────────────────────────

  responses:
    BadRequest:
      description: Nevalidní data – chybějící nebo nesprávná povinná pole
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiResponseError"
          example:
            app:
              datetime: "2026-05-31 09:00:00"
              version: 1.0
            response:
              code: 400
              status: error
              message: 'Received data for entity "RequestTournamentDto" is invalid due to missing or corrupted properties: "name".'
              requiredProperties: [uid, tournament_csju_id, name]
              invalidProperties: [name]

    Unauthorized:
      description: Chybějící nebo neplatný API token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiResponseError"
          example:
            app:
              datetime: "2026-05-31 09:00:00"
              version: 1.0
            response:
              code: 401
              status: error
              message: "Unauthorized"

    NotFound:
      description: Entita nenalezena
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiResponseError"
          example:
            app:
              datetime: "2026-05-31 09:00:00"
              version: 1.0
            response:
              code: 404
              status: error
              message: "Tournament UID abc123 not found."

    NotAcceptable:
      description: Požadavek nelze zpracovat (např. duplicita entity nebo chybějící vazba)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiResponseError"
          example:
            app:
              datetime: "2026-05-31 09:00:00"
              version: 1.0
            response:
              code: 406
              status: error
              message: "Linked entity was not found."

    InternalError:
      description: Interní chyba serveru
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiResponseError"
          example:
            app:
              datetime: "2026-05-31 09:00:00"
              version: 1.0
            response:
              code: 500
              status: error
              message: "Application encountered an internal error, exception was logged. Please try again later."
